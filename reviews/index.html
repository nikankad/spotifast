<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotifast contribution reviews</title><style>body{font:16px system-ui;margin:0;background:#171a20;color:#e5e7eb}main{max-width:1360px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 12px}p{line-height:1.5;max-width:1000px}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:8px 12px;border:1px solid #677181;border-radius:6px;background:#252b35;color:inherit}button[aria-pressed=true]{background:#c7f5d5;color:#14351f}img{display:block;max-width:100%;height:auto;margin:auto}figure{margin:0;background:#101217;padding:12px}figcaption{margin-bottom:12px;color:#c3cbd7}a{color:#b3d6ff}iframe{width:100%;height:1200px;border:0}small{color:#b4bdcb}</style><main><h1>Spotifast contribution reviews</h1><p>Two focused contributions based on upstream dd2d5e3. Select a review to load its captures.</p><nav><button id="previous">Previous</button><select id="review"><option value="play-next">Play next (PR pending)</option><option value="enlarged-covers">Enlarged album and playlist covers (PR pending)</option></select><button id="next">Next</button><a id="direct">Direct link</a></nav><iframe id="frame" title="Selected visual review"></iframe></main><script>const select=document.querySelector('#review');function load(){const path=select.value+'.html';document.querySelector('#frame').src=path;document.querySelector('#direct').href=path;}select.onchange=load;for(const [id,step] of [['previous',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{select.selectedIndex=(select.selectedIndex+step+select.options.length)%select.options.length;load();};load();</script></html>
